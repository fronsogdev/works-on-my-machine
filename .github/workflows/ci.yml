# Continuous integration for the Works On My Machine™ Certification Authority.
#
# Runs on every pull request, on pushes to main, and on manual dispatch. Version
# tags (v*) are included so docker/metadata-action can emit semantic-version tags
# for a release.
#
# House rules enforced here:
#   * every third-party action is pinned by full commit SHA, with the friendly
#     version in a trailing comment;
#   * permissions are denied at the top level and granted per job, least privilege;
#   * a manual (workflow_dispatch) run validates only — nothing is pushed or signed.

name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Deny everything by default. Each job opts in to exactly the scopes it needs.
permissions: {}

# One run per workflow + ref. A new push to a pull request cancels its previous
# run; pushes to main are never cancelled so a release is never cut in half.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Lint, type-check and test. This is the gate every pull request must pass.
  # ---------------------------------------------------------------------------
  quality:
    name: quality (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Same uv release the images build with, so the lockfile is treated
          # identically here and in the Dockerfiles.
          version: "0.12.1"
          enable-cache: true

      - name: Install the locked dependency set
        run: uv sync --locked

      - name: Lint, format-check and type-check
        run: make lint

      - name: Run the test suite with the coverage gate
        # The testcontainers integration test talks to a real Postgres container;
        # GitHub-hosted runners have Docker, so it runs here on purpose.
        run: make test

      - name: Upload the HTML coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: warn

      - name: Add a developer excuse to the summary
        if: failure()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import sys

          # The excuses live in the application itself and app/excuses.py only
          # imports the standard library, so CI can borrow one for the summary.
          sys.path.insert(0, os.getcwd())
          try:
              from app.excuses import random_excuse

              excuse = random_excuse()
          except Exception:
              excuse = "It worked on my machine."

          print("### Build failed")
          print()
          print(f"> {excuse}")
          PY

  # ---------------------------------------------------------------------------
  # Dockerfile linting. Dockerfile.naive is a deliberately bad teaching artefact
  # that exists only so the README can compare a sloppy image with a good one;
  # linting it would produce pure noise, so it is left out of the matrix.
  # ---------------------------------------------------------------------------
  hadolint:
    name: hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - docker/Dockerfile.api
          - docker/Dockerfile.worker
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # Info-level findings (for example DL3066, a named rather than numeric
          # user) are printed but do not fail the build; warnings and errors do.
          failure-threshold: warning

      - name: Add a developer excuse to the summary
        if: failure()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          try:
              from app.excuses import random_excuse

              excuse = random_excuse()
          except Exception:
              excuse = "It worked on my machine."

          print("### Build failed")
          print()
          print(f"> {excuse}")
          PY

  # ---------------------------------------------------------------------------
  # Build the api and worker images for both architectures and scan them with
  # Trivy and Syft. This job never publishes: each leg builds one platform and
  # loads it into the local daemon (a foreign-architecture image loads fine, and
  # scanning never executes it), so Trivy and Syft inspect the image locally.
  # It runs on pull requests and on main alike, and deliberately holds no
  # packages scope, so a pull request can never write to ghcr. Publishing is the
  # separate, main-only push-images job below.
  # ---------------------------------------------------------------------------
  build-scan:
    name: build & scan (${{ matrix.image }}, ${{ matrix.platform.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      security-events: write # upload the Trivy SARIF report
      actions: read # read the shared buildx cache
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker]
        platform:
          - { name: linux/amd64, arch: amd64 }
          - { name: linux/arm64, arch: arm64 }
    env:
      # The freshly built image is loaded into the local daemon under this tag;
      # nothing is pushed from this job.
      SCAN_IMAGE: womm/${{ matrix.image }}:scan
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (emulates arm64 for the matrix)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.image }} for ${{ matrix.platform.name }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Keep the build plain: BuildKit's default provenance attestation wraps
          # each per-platform image in an index that merge-manifest cannot fold
          # into one clean multi-architecture image. The `provenance: false`
          # input does not help — an empty value still falls through to the
          # default attestation — so this environment variable is the escape
          # hatch.
          BUILDX_NO_DEFAULT_ATTESTATIONS: "true"
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: ${{ matrix.platform.name }}
          push: false
          # A foreign-architecture image loads fine into the local daemon; the
          # scan never runs it, so the arm64 leg is scanned on the amd64 runner.
          load: true
          tags: ${{ env.SCAN_IMAGE }}
          # A shared, per-image and per-architecture scope lets the publish job
          # below reuse this build instead of recompiling it. Without the
          # explicit scope each job gets its own default scope and the cache is
          # never shared.
          cache-from: type=gha,scope=womm-${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=womm-${{ matrix.image }}-${{ matrix.platform.arch }}

      - name: Trivy scan (${{ matrix.image }}, ${{ matrix.platform.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Trivy has no way to infer the platform of the locally loaded image;
          # name it per matrix leg.
          TRIVY_PLATFORM: ${{ matrix.platform.name }}
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          format: sarif
          output: trivy-${{ matrix.image }}-${{ matrix.platform.arch }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          # When emitting SARIF the action drops the severity filter unless this
          # is set, which would make --exit-code fail on every severity rather
          # than just HIGH/CRITICAL.
          limit-severities-for-sarif: true
          # Fail on every HIGH/CRITICAL finding, fixed or unfixed. The only
          # exceptions are the explicitly triaged CVEs in the repo-root
          # .trivyignore, which the action reads and hands to Trivy.
          ignore-unfixed: false
          trivyignores: .trivyignore

      - name: Upload the Trivy SARIF report
        # Runs even when Trivy fails the leg, so the findings are visible in the
        # Security tab. Fork pull requests cannot write security events, so they
        # are skipped rather than failed.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.image }}-${{ matrix.platform.arch }}.sarif
          # A distinct category per image and platform keeps both reports
          # separate in the Security tab.
          category: trivy-${{ matrix.image }}-${{ matrix.platform.arch }}

      - name: Generate an SPDX SBOM with Syft (${{ matrix.image }}, ${{ matrix.platform.arch }})
        if: always()
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          # Same reason as Trivy: tell Syft which platform to resolve.
          SYFT_PLATFORM: ${{ matrix.platform.name }}
        with:
          image: ${{ env.SCAN_IMAGE }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}-${{ matrix.platform.arch }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}-${{ matrix.platform.arch }}

      - name: Add a developer excuse to the summary
        if: failure()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          try:
              from app.excuses import random_excuse

              excuse = random_excuse()
          except Exception:
              excuse = "It worked on my machine."

          print("### Build failed")
          print()
          print(f"> {excuse}")
          PY

  # ---------------------------------------------------------------------------
  # Publish the per-platform images. This is the only job that is granted
  # packages: write, and it is gated to push events (main and v* tags), so a
  # pull request never holds publish rights. It reuses the buildx cache that
  # build-scan just populated, so the rebuild is a cache hit. merge-manifest then
  # folds the two platform tags into one index.
  # ---------------------------------------------------------------------------
  push-images:
    name: push images (${{ matrix.image }}, ${{ matrix.platform.arch }})
    needs: build-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      packages: write # push the per-platform images to ghcr
      actions: read # reuse the shared buildx cache
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker]
        platform:
          - { name: linux/amd64, arch: amd64 }
          - { name: linux/arm64, arch: arm64 }
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (emulates arm64 for the matrix)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }} for ${{ matrix.platform.name }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Push plain single-platform manifests, matching build-scan. Without
          # this each per-platform push becomes an index with an attestation and
          # merge-manifest cannot fold it into one clean multi-architecture image.
          BUILDX_NO_DEFAULT_ATTESTATIONS: "true"
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: ${{ matrix.platform.name }}
          push: true
          tags: ghcr.io/fronsogdev/works-on-my-machine/${{ matrix.image }}:build-${{ github.sha }}-${{ matrix.platform.arch }}
          # Same scope as build-scan, so this is a cache hit rather than a
          # second full build.
          cache-from: type=gha,scope=womm-${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=womm-${{ matrix.image }}-${{ matrix.platform.arch }}

      - name: Add a developer excuse to the summary
        if: failure()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          try:
              from app.excuses import random_excuse

              excuse = random_excuse()
          except Exception:
              excuse = "It worked on my machine."

          print("### Build failed")
          print()
          print(f"> {excuse}")
          PY

  # ---------------------------------------------------------------------------
  # Stitch the per-platform images into one multi-platform manifest list. This
  # runs once per image, after every push-images leg has succeeded. Tag policy:
  # `sha-<git sha>` always, `latest` only for main-line commits, and a semantic
  # version only when a v* tag was pushed (see the trigger above).
  # ---------------------------------------------------------------------------
  merge-manifest:
    name: merge manifest (${{ matrix.image }})
    needs: push-images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # write the manifest list and final tags to ghcr
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the final tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/fronsogdev/works-on-my-machine/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Combine the per-platform images into one manifest list
        run: |
          # One `-t <tag>` pair per line, read into an array so the tags survive
          # any whitespace without relying on word splitting.
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "ghcr.io/fronsogdev/works-on-my-machine/${{ matrix.image }}:build-${GITHUB_SHA}-amd64" \
            "ghcr.io/fronsogdev/works-on-my-machine/${{ matrix.image }}:build-${GITHUB_SHA}-arm64"

      - name: Add a developer excuse to the summary
        if: failure()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          try:
              from app.excuses import random_excuse

              excuse = random_excuse()
          except Exception:
              excuse = "It worked on my machine."

          print("### Build failed")
          print()
          print(f"> {excuse}")
          PY

  # ---------------------------------------------------------------------------
  # Sign the merged images on main, keyless, using the ambient GitHub OIDC
  # token — no long-lived signing key is stored anywhere. The signature is tied
  # to the image digest, so it covers every tag that points at that digest.
  # ---------------------------------------------------------------------------
  sign:
    name: sign ${{ matrix.image }} (keyless)
    needs: merge-manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the signature artefact to ghcr
      id-token: write # exchange the OIDC token for a Fulcio certificate
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Buildx (for `imagetools inspect`)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the SHA-tagged image
        env:
          IMAGE: ghcr.io/fronsogdev/works-on-my-machine/${{ matrix.image }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Signing ${IMAGE}@${digest}"
          cosign sign --yes "${IMAGE}@${digest}"

      - name: Add a developer excuse to the summary
        if: failure()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          try:
              from app.excuses import random_excuse

              excuse = random_excuse()
          except Exception:
              excuse = "It worked on my machine."

          print("### Build failed")
          print()
          print(f"> {excuse}")
          PY
