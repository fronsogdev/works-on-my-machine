# Pre-commit hooks. Mirrors the `make lint` target: ruff for lint + format,
# mypy for types.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^(app|worker|migrations|tests)/
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - alembic
          - aiosqlite
          - asyncpg
          - fakeredis
          - fastapi
          - httpx
          - pillow
          - prometheus-client
          - psycopg[binary]
          - pydantic
          - pydantic-settings
          - pytest
          - redis
          - rq
          - sqlalchemy[asyncio]
          - structlog
          - testcontainers[postgres]
